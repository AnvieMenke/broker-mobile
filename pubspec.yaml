name: broker_mobile
description: "SAS Broker App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.6.0
  grpc: ^4.1.0
  protobuf: ^4.1.0
  fixnum: ^1.1.0
  flutter_dotenv: ^6.0.0
  flutter_typeahead: ^5.2.0
  fluttertoast: ^8.2.4
  jwt_decode: ^0.3.1
  decimal: ^3.0.2
  intl: ^0.19.0
  multi_select_flutter: ^4.1.3
  shared_preferences: ^2.2.2
  flutter_html: ^3.0.0-beta.2
  pin_code_fields: ^8.0.1
  intl_phone_field: ^3.1.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.69.0
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/no_data.png
    - assets/images/sas_logo.png
